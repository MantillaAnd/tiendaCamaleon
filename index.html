<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Sitio Web</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1 id="logoTienda" style="cursor:pointer; color:inherit; text-decoration:none;">Tiendita Camaleón</h1>
            <div class="header-icons">
                <button id="btnLogin" title="Acceso Usuario" class="icon-btn">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#388E3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M6 20v-2a4 4 0 0 1 4-4h0a4 4 0 0 1 4 4v2"/></svg>
                </button>
                <button id="btnCarrito" title="Ver Carrito" class="icon-btn">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#388E3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                </button>
            </div>
        </div>
    </header>
    <main>
        <div id="contenedor-principal">
            <section id="principal">
                <h2>Productos en Venta</h2>
                <div id="productos-venta" class="productos-grid"></div>
                <div id="productos-ejemplo" class="productos-grid" style="margin-top:2em;"></div>
                <div class="carrito-flotante" id="carritoFlotante" style="display:none;">
                    <h2>Carrito de Compras</h2>
                    <div id="carrito"></div>
                    <button id="finalizarCompra" style="display:none;">Finalizar Compra</button>
                    <div id="mensajeCompra"></div>
                </div>
            </section>
            <section id="admin-login" style="display:none;">
                <h2>Acceso Administrador</h2>
                <form id="formAdminLogin">
                    <input type="text" id="adminUser" placeholder="Usuario" required>
                    <input type="password" id="adminPass" placeholder="Contraseña" required>
                    <button type="submit">Entrar</button>
                </form>
                <div id="mensajeAdminLogin"></div>
            </section>
            <section id="admin-consola" style="display:none;">
                <h2>Consola Administradora</h2>
                <div style="display:flex; gap:2em; align-items:flex-start;">
                    <nav id="adminMenu" style="min-width:180px;">
                        <ul style="list-style:none; padding:0; margin:0;">
                            <li><button type="button" class="admin-menu-btn" id="btnMenuProductos">Productos</button></li>
                            <li><button type="button" class="admin-menu-btn" id="btnMenuUsuarios">Usuarios</button></li>
                            <li><button type="button" class="admin-menu-btn" id="btnMenuPersonalizacion">Personalización</button></li>
                        </ul>
                    </nav>
                    <div style="flex:1;">
                        <div id="adminProductos" class="admin-bloque">
                            <h3>Gestión de Productos</h3>
                            <form id="formProducto">
                                <input type="text" id="nombreProducto" placeholder="Nombre del producto" required>
                                <input type="number" id="precioProducto" placeholder="Precio" required min="0">
                                <input type="url" id="imagenProducto" placeholder="URL de la imagen" required>
                                <button type="submit">Agregar/Modificar Producto</button>
                            </form>
                            <div style="margin:1em 0;">
                                <label><strong>Carga masiva de productos (CSV):</strong>
                                    <input type="file" id="cargaMasiva" accept=".csv">
                                </label>
                                <small>Formato: nombre,cantidad,precio,descripcion,imagen</small>
                            </div>
                            <div id="listaProductos"></div>
                        </div>
                        <div id="adminUsuarios" class="admin-bloque" style="display:none;">
                            <h3>Gestión de Usuarios</h3>
                            <form id="formRegistro">
                                <input type="text" id="nombreUsuario" placeholder="Nombre de usuario" required>
                                <input type="email" id="emailUsuario" placeholder="Correo electrónico" required>
                                <input type="password" id="passwordUsuario" placeholder="Contraseña" required>
                                <button type="submit">Registrar</button>
                            </form>
                            <div id="mensajeRegistro"></div>
                            <div id="listaUsuarios"></div>
                        </div>
                        <div id="adminPersonalizacion" class="admin-bloque" style="display:none;">
                            <h3>Personalización del Sitio</h3>
                            <form id="formPersonalizacion">
                                <label>Color principal: <input type="color" id="colorPrincipal" value="#4CAF50"></label>
                                <label>Color de fondo: <input type="color" id="colorFondo" value="#f4f4f4"></label>
                                <label>Color de botones: <input type="color" id="colorBoton" value="#388E3C"></label>
                                <br><br>
                                <label>Imagen de fondo: <input type="url" id="urlFondo" placeholder="URL de imagen"></label>
                                <br><br>
                                <label>Información adicional:<br>
                                    <textarea id="infoAdicional" rows="3" style="width:100%;"></textarea>
                                </label>
                                <br>
                                <label>Música de fondo (URL MP3): <input type="url" id="urlMusica" placeholder="URL de archivo MP3"></label>
                                <br><br>
                                <button type="submit">Aplicar cambios</button>
                                <button type="button" id="guardarConfig" style="margin-left:1em;">Guardar configuración</button>
                            </form>
                            <div id="infoAdicionalVista" style="margin:1em 0;"></div>
                            <audio id="musicaFondo" controls loop style="display:none; margin-bottom:1em;"></audio>
                        </div>
                    </div>
                </div>
                <button id="cerrarAdmin">Cerrar sesión admin</button>
            </section>

        </div>
    </main>
    <footer>
        <p>&copy; 2025 Tiendita Camaleón | <a href="#" id="enlaceAdmin" style="color:#388E3C; text-decoration:underline; cursor:pointer;">Acceso administrador</a></p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
